[project]
name = "smuon"
version = "0.1.0"
description = "Adaptive Schatten-p Norm Training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.7.0",
    "gymnasium>=1.2.3",
    "matplotlib>=3.10.8",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "timm>=1.0.25",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0",
    "wandb>=0.25.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smuon*"]
